services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  people:
    build:
      context: .
      dockerfile: people/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "8081:80"

  delivery:
    build:
      context: .
      dockerfile: delivery/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "8082:80"

  shell:
    build:
      context: .
      dockerfile: shell/Dockerfile
    depends_on:
      people:
        condition: service_healthy
      delivery:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "8080:80"

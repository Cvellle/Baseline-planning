server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /people/ {
        proxy_pass http://people:80/;
        proxy_http_version 1.1;
    }

    location /delivery/ {
        proxy_pass http://delivery:80/;
        proxy_http_version 1.1;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
    }
}

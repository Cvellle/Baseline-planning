server {
    listen 80;
    listen [::]:80;

    # Static app (index.html + assets + remoteEntry.js for Shell to fetch)
    root /usr/share/nginx/html;
    index index.html;

    # Needed so Shell can fetch remoteEntry.js cross-origin if you choose
    # the direct-URL approach instead of proxying through Shell. Harmless
    # when using the proxy approach.
    add_header Access-Control-Allow-Origin *;

    # Hashed build assets and the MF remote entry must 404 when missing --
    # falling back to index.html here would mask a stale/removed chunk
    # reference as a 200 text/html response, which then fails confusingly
    # as "not valid JavaScript" instead of a clear 404.
    # Content-hashed, safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Not content-hashed -- must always be revalidated, or a rebuilt remote
    # can leave the browser holding chunk references that no longer exist.
    location = /remoteEntry.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Lets People run fully standalone (docker compose up people, or
    # localhost:8081 directly) and still reach the API on the same origin.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off; # required for the SSE endpoint
        proxy_cache off;
    }
}

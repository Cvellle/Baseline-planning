server {
    listen 80;
    listen [::]:80;

    # Static app (index.html + assets + remoteEntry.js for Shell to fetch)
    root /usr/share/nginx/html;
    index index.html;

    # Needed so Shell can fetch remoteEntry.js cross-origin if you choose
    # the direct-URL approach instead of proxying through Shell. Harmless
    # when using the proxy approach.
    add_header Access-Control-Allow-Origin *;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lets People run fully standalone (docker compose up people, or
    # localhost:8081 directly) and still reach the API on the same origin.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off; # required for the SSE endpoint
        proxy_cache off;
    }
}

server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lets People reach the API on its own origin when run standalone.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
    }
}
